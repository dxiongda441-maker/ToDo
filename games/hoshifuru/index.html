<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>ほしふるクエスト</title>
    <meta name="description" content="星をうばわれた世界で、3つのほしのしずくを集める旅。レベルを上げて強くなる、ドット絵のRPG。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game" id="game">
        <div class="screen" id="screen">
            <canvas id="canvas" width="272" height="208" aria-label="ゲーム画面"></canvas>
            <div class="ui" id="ui"></div>
            <div class="fade" id="fade"></div>
        </div>

        <!-- スマホ用のボタン（キーボードがあれば使わなくてよい） -->
        <div class="pad" id="pad" aria-label="操作ボタン">
            <div class="dpad">
                <button type="button" class="pad-btn up" data-key="up" aria-label="上">▲</button>
                <button type="button" class="pad-btn left" data-key="left" aria-label="左">◀</button>
                <button type="button" class="pad-btn right" data-key="right" aria-label="右">▶</button>
                <button type="button" class="pad-btn down" data-key="down" aria-label="下">▼</button>
            </div>
            <div class="ab">
                <button type="button" class="pad-btn b" data-key="cancel" aria-label="キャンセル・メニュー">B</button>
                <button type="button" class="pad-btn a" data-key="ok" aria-label="決定・はなす">A</button>
            </div>
        </div>

        <p class="help">
            <strong>操作</strong>：矢印キー（WASD）で移動・選択／ Z・Enter・スペースで決定・はなす・しらべる／ X・Esc でキャンセル・メニュー
        </p>
        <p class="links"><a href="../index.html">← ゲーム一覧</a></p>
    </main>

    <!-- 読み込み順：data → rules → maps → sprites → audio → game -->
    <script src="data.js" defer></script>
    <script src="rules.js" defer></script>
    <script src="maps.js" defer></script>
    <script src="sprites.js" defer></script>
    <script src="audio.js" defer></script>
    <script src="game.js" defer></script>
</body>
</html>
