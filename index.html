<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ToDo App</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/tasks.css">
    <link rel="stylesheet" href="css/history.css">
</head>
<body>
    <main class="app">
        <h1>ToDo List</h1>
        <form id="todo-form" class="todo-form" autocomplete="off">
            <label class="visually-hidden" for="task-input">Task</label>
            <input id="task-input" name="task" type="text" placeholder="Add a new task" required>
            <button type="submit">Add</button>
        </form>

        <section class="controls" aria-label="Task controls">
            <div class="filters" role="group" aria-label="Filters">
                <button type="button" class="filter-button active" data-filter="all">All</button>
                <button type="button" class="filter-button" data-filter="active">Active</button>
                <button type="button" class="filter-button" data-filter="completed">Completed</button>
            </div>
            <button type="button" id="clear-completed" class="clear-button">Clear completed</button>
        </section>

        <section aria-label="Task list" class="task-section">
            <ul id="task-list" class="task-list" aria-live="polite"></ul>
            <p id="empty-state" class="empty-state" hidden>No tasks yet. Add your first one above!</p>
        </section>

        <footer class="summary" aria-live="polite">
            <span id="task-count">0 tasks</span>
            <span id="completed-count">0 completed tasks</span>
        </footer>

        <section class="history-section" aria-label="Task history">
            <header class="history-header">
                <h2>Task History</h2>
                <div class="month-nav">
                    <button type="button" id="prev-month" class="month-button" aria-label="View previous month">Prev</button>
                    <span id="month-label" class="month-label"></span>
                    <button type="button" id="next-month" class="month-button" aria-label="View next month">Next</button>
                </div>
            </header>
            <div class="calendar-wrapper">
                <div class="calendar-grid" id="calendar-grid" role="grid" aria-labelledby="month-label"></div>
            </div>
            <div class="history-list">
                <h3 id="history-date-label" class="history-date-label"></h3>
                <ul id="history-items" class="history-items"></ul>
                <p id="history-empty" class="history-empty" hidden>No activity logged for this day.</p>
            </div>
        </section>
    </main>

    <template id="task-template">
        <li class="task-item">
            <label class="task-main">
                <input type="checkbox" class="task-toggle">
                <span class="task-body">
                    <span class="task-text"></span>
                    <time class="task-meta" datetime=""></time>
                </span>
            </label>
            <div class="task-actions">
                <button type="button" class="edit-button" title="Edit task">Edit</button>
                <button type="button" class="delete-button" title="Delete task">Delete</button>
            </div>
        </li>
    </template>

    <!-- 読み込み順に依存関係があるため、この順番を変えないこと -->
    <script src="js/utils.js" defer></script>
    <script src="js/state.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/tasks.js" defer></script>
    <script src="js/history.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
