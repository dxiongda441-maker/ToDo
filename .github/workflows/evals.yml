name: Evals

on:
  pull_request:
    paths:
      - "evals/**"
      - ".github/workflows/evals.yml"
  workflow_dispatch:
    inputs:
      trials:
        description: "Trials per task"
        default: "3"
      tasks:
        description: "Comma-separated task ids (empty = all)"
        default: ""
      model:
        description: "Model for the agent under test (empty = Claude Code default)"
        default: ""
      judge:
        description: "Also run the LLM rubric judge"
        type: boolean
        default: false
      claude_version:
        description: "Claude Code version under test (pinned so runs stay comparable)"
        default: "2.1.314"
      baseline:
        description: "Baseline in evals/baselines/ to compare against"
        default: "main.json"

permissions:
  contents: read

jobs:
  # Validates the eval itself with no model calls: reference solutions must
  # pass every task and an untouched workspace must fail every task.
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evals/package-lock.json
      - run: npm ci
        working-directory: evals
      - run: npx playwright install --with-deps chromium
        working-directory: evals
      - run: npm run selfcheck
        working-directory: evals
        env:
          SELFCHECK_TRIALS: "3"

  agent:
    if: github.event_name == 'workflow_dispatch'
    needs: selfcheck
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evals/package-lock.json
      - run: npm ci
        working-directory: evals
      - run: npx playwright install --with-deps chromium
        working-directory: evals
      - run: npm install -g "@anthropic-ai/claude-code@${{ inputs.claude_version }}"
      # The sandbox keeps the agent's Bash out of the checkout (graders,
      # reference solutions). Ubuntu 24.04 needs unprivileged user namespaces
      # allowed for bubblewrap.
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run evals
        working-directory: evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRIALS: ${{ inputs.trials }}
          TASKS: ${{ inputs.tasks }}
          MODEL: ${{ inputs.model }}
          JUDGE: ${{ inputs.judge }}
        run: |
          args=(--trials "$TRIALS" --out-dir results/ci --regression-threshold 0.9)
          [ -n "$TASKS" ] && args+=(--tasks "$TASKS")
          [ -n "$MODEL" ] && args+=(--model "$MODEL")
          [ "$JUDGE" = "true" ] && args+=(--judge)
          node run.js "${args[@]}"
      - name: Write job summary
        if: always()
        working-directory: evals
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          cat results/ci/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f "baselines/$BASELINE" ] && [ -f results/ci/summary.json ]; then
            node compare.js "baselines/$BASELINE" results/ci/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/ci
