[project]
name = "market-mcp"
version = "0.1.0"
description = "ゴールド・日経225・BTCUSD・ドル円の過去データ取得、パフォーマンス分析、簡易バックテストを行う自作MCPサーバー"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # v2 系は API が変わったため 1.x に固定（FastMCP を使う）
  "mcp[cli]>=1.28,<2",
  "pandas>=2",
  "numpy>=1.26",
  "requests>=2.32",
  "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
market-mcp = "market_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
